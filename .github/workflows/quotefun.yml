name: quote fun

on:
  workflow_dispatch:

env:
  test: abc

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - name: Set color
        id: color-selector
        run: >
          curl -fsSL --max-time 30 \
            --user '${{ format('{0}:{1}', env.test, env.test) }}' \
            --header 'Content-Type: application/json; charset=utf-8' \
            --header '${{ format('x-amz-security-token: {0}', env.test) }}' \
            --data '${{ format('{{"CorrelationId":"{0}:{1}:{2}:{3}"}}', github.repository, github.run_id, github.run_number, github.run_attempt) }}' \
            --aws-sigv4 '${{ format('aws:amz:{0}:lambda', env.test) }}' \
            --url 'google.com/register'
          
